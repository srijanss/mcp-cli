[package]
name = "mcp-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = { version = "0.8", features = ["preserve_order"] }
