name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - run: cp target/${{ matrix.target }}/release/mcp-cli mcpctl-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcpctl-${{ matrix.target }}
          path: mcpctl-${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate and verify SHA-256 checksums
        run: |
          mkdir release
          find artifacts -type f -name 'mcpctl-*' -exec cp {} release/ \;
          cd release
          sha256sum mcpctl-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          scripts/stage-release-checksums.sh artifacts release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mcpctl-*
            release/SHA256SUMS
